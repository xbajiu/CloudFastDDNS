# ==============================================================================
# CloudFastDDNS 配置文件 (基于 lee1080/CloudflareSpeedTestDDNS main 分支)
# 映射路径: /opt/cloudfastddns/config.conf
# ==============================================================================

# ------------------------------------------基础与工作模式配置------------------------------------------
# --GitHub 代理地址--
PROXY="https://gh-proxy.com/"

# --是否开启定时运行--
AUTO_RUN=true

# --定时运行 Cron 表达式--
TIMING="0 */6 * * *"

# --运行模式-- (ipv4 or ipv6)
IP_ADDR=ipv4

# --是否使用反代ip-- (0=关闭，1=线路1，2=线路2)
IP_PR_IP=0

# --是否同步更新到hosts-- (true or false)
IP_TO_HOSTS=false

# --选择DNS服务商-- (1=cloudflare  2=dnspod)
DNS_PROVIDER=1

# --填写需要DDNS的完整域名-- (填入需要更新DDNS的完整域名，空格分隔，例如 cdn.test.com)
hostname=()

# ------------------------------------------cloudflare配置------------------------------------------
# --cloudflare账号邮箱--
x_email=""

# --Global API Key-- (每个账户只有一个Global API Key，切记不要填写成区域API Token；空间Zone ID会自动获取无需填写)
api_key=""

# --一个域名解析多个IP-- (false=一个域名一个IP，true=一个域名多个IP)
MULTI_IP=false

# --每个域名解析的IP数量-- (仅 MULTI_IP=true 时生效)
MULTI_IP_NUM=3

# ------------------------------------------dnspod配置------------------------------------------
# --dnspod的id,token-- (API密钥 - DNSPod Token，填写格式为 ID,Token)
dnspod_token=""

# --选择线路-- (0=默认，1=电信，2=联通，3=移动，4=铁通，5=广电，6=教育网，7=境内，8=境外)
LINE=0

# ----------------------------------------CloudflareST配置----------------------------------------
# --测速地址--
CFST_URL="https://cf.xiu2.xyz/url"

# --测速地址端口--
CFST_TP=443

# --下载测速时间-- (单个IP测速最长时间，不能太短，默认10)
CFST_DT=10

# --测速模式-- (默认TCPing留空，切换HTTPing模式填httping)
CFST_STM=""

# --有效状态代码-- (HTTPing模式下有效状态代码，如 200)
httping_code=""

# --匹配指定地区-- (HTTPing模式下机场三字码，英文逗号分隔，如 HKG,KHH,NRT,LAX,SEA,SJC,FRA,MAD)
cfcolo=""

# --测速线程数量-- (越多延迟测速越快，性能弱的设备请勿太高；默认 200 最多 1000)
CFST_N=200

# --延迟测速次数-- (单个 IP 延迟测速次数；默认 4 次)
CFST_T=4

# --下载测速数量-- (延迟测速并排序后，从最低延迟起下载测速的数量；默认 10 个)
CFST_DN=10

# --平均延迟上限-- (只输出低于指定平均延迟的 IP，默认300ms)
CFST_TL=300

# --平均延迟下限-- (过滤假墙IP，默认0ms)
CFST_TLL=0

# --丢包几率上限-- (范围 0.00~1.00，0 过滤掉任何丢包的 IP，默认0.2)
CFST_TLR=0.2

# --下载速度下限-- (单位 MB/s，找到指定数量的结果后停止测速，默认5)
CFST_SL=5

# --------------------------------------------推送设置--------------------------------------------
# ----TG推送设置----
telegramBotToken=""
telegramBotUserId=""
Proxy_TG=""

# ----PushPlus设置----
PushPlusToken=""

# ----Server 酱推送设置----
ServerSendKey=""

# ----PushDeer推送设置----
PushDeerPushKey=""

# ----企业微信推送设置----
CORPID=""
SECRET=""
AGENTID=""
USERID=""
Proxy_WX=""

# ----Synology Chat推送----
Synology_Chat_URL=""

